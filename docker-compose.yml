services:
  tautulli:
    image: ghcr.io/linuxserver/tautulli:latest
    container_name: tautulli-l-swarm
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=America/Chicago
    volumes:
    - tautulli-l-swarm_config:/config
    ports:
    - target: 8181
      published: 81
      protocol: tcp
      mode: host
    deploy:
      placement:
        constraints:
        - node.role==manager
      restart_policy:
        condition: on-failure
volumes:
  tautulli-l-swarm_config:
    name: tautulli-l-swarm_config
