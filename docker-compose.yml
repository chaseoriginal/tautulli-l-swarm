x-base: &base
  restart: unless-stopped
  networks:
    - tautulli-l-swarm_default

services:
  tautulli:
    <<: *base
    image: lscr.io/linuxserver/tautulli:latest
    container_name: ${CNAME}
    user: ${PUID}:${PGID}
    environment:
      - TZ=${TZ}
    volumes:
      - /var/lib/docker/volumes/tautulli-l-swarm/config:/config
    ports:
      - target: 8181
        published: 81
        protocol: tcp
        mode: host
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.deployment.target.tautulli-l == true
      restart_policy:
        condition: on-failure

networks:
  tautulli-l-swarm_default:
    external: true
    name: tautulli-l-swarm_default
